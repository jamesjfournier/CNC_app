name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DBA CNC
        shell: cmd
        run: src\Build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: DBA-CNC
          path: src/DBA CNC.exe
